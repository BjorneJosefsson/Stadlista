<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Städlistan">
<title>STAD.SYS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #080C10;
    --surface: #0D1117;
    --border: #1C2A38;
    --border-bright: #1E3A50;
    --ink: #C8D8E8;
    --ink-2: #6A8A9A;
    --ink-3: #304050;
    --cyan: #00C8FF;
    --cyan-dim: rgba(0,200,255,0.08);
    --cyan-glow: rgba(0,200,255,0.15);
    --purple: #B06EFF;
    --purple-dim: rgba(176,110,255,0.08);
    --purple-glow: rgba(176,110,255,0.15);
    --green: #00FF88;
    --green-dim: rgba(0,255,136,0.08);
    --red: #FF3B5C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(0,200,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .page { max-width: 500px; margin: 0 auto; padding: 32px 16px 80px; }

  .header { margin-bottom: 24px; border-left: 2px solid var(--cyan); padding-left: 14px; }
  .header .sys { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--cyan); letter-spacing: 0.15em; margin-bottom: 4px; opacity: 0.7; }
  .header h1 { font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 400; color: var(--cyan); letter-spacing: 0.05em; text-shadow: 0 0 20px rgba(0,200,255,0.4); }
  .header .sub { font-size: 11px; color: var(--ink-2); margin-top: 4px; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.05em; }

  /* Week display */
  .week-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .week-info { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .week-info strong { color: var(--cyan); }
  .week-info .next-swap { font-size: 10px; color: var(--ink-3); margin-top: 2px; }

  .sync-indicator { display: flex; align-items: center; gap: 5px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--ink-2); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .sync-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sync-dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .divider { height: 1px; background: linear-gradient(90deg, var(--cyan) 0%, transparent 100%); margin: 16px 0; opacity: 0.3; }

  /* Person columns */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }

  .person-col { }

  .person-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .person-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    font-weight: 400;
  }

  .person-name.nora { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
  .person-name.ludwig { color: var(--purple); text-shadow: 0 0 12px var(--purple-glow); }

  .person-progress {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
  }
  .person-progress.done { color: var(--green); }

  .task-list { list-style: none; }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .task-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    border-radius: 6px 0 0 6px;
  }

  .nora-col .task-item::before { background: var(--border); }
  .nora-col .task-item.done::before { background: var(--cyan); }
  .ludwig-col .task-item::before { background: var(--border); }
  .ludwig-col .task-item.done::before { background: var(--purple); }

  .task-check {
    width: 14px; height: 14px; min-width: 14px;
    border-radius: 2px;
    border: 1px solid var(--border-bright);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: transparent;
    margin-top: 1px;
    transition: all 0.15s;
    font-family: 'Share Tech Mono', monospace;
  }

  .nora-col .task-item.done .task-check {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
    box-shadow: 0 0 5px var(--cyan-glow);
  }

  .ludwig-col .task-item.done .task-check {
    border-color: var(--purple);
    color: var(--purple);
    background: var(--purple-dim);
    box-shadow: 0 0 5px var(--purple-glow);
  }

  .task-name {
    font-size: 12px;
    color: var(--ink);
    line-height: 1.3;
    user-select: none;
  }

  .task-item.done .task-name {
    color: var(--ink-3);
    text-decoration: line-through;
  }

  /* Shared tasks */
  .shared-section { margin-bottom: 20px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .section-label::before { content: '▶'; font-size: 7px; color: var(--cyan); opacity: 0.6; }
  .section-label span { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--ink-2); letter-spacing: 0.12em; text-transform: uppercase; }

  .shared-list { list-style: none; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .shared-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .shared-item:last-child { border-bottom: none; }
  .shared-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent; }
  .shared-item.done::before { background: var(--green); }

  .shared-check {
    width: 14px; height: 14px; min-width: 14px;
    border-radius: 2px;
    border: 1px solid var(--border-bright);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent;
    font-family: 'Share Tech Mono', monospace;
    transition: all 0.15s;
  }
  .shared-item.done .shared-check { border-color: var(--green); color: var(--green); background: var(--green-dim); box-shadow: 0 0 5px rgba(0,255,136,0.2); }
  .shared-name { font-size: 12px; color: var(--ink); flex: 1; user-select: none; }
  .shared-item.done .shared-name { color: var(--ink-3); text-decoration: line-through; }
  .shared-by { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--ink-3); }

  /* Buttons */
  .toolbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  button { font-family: 'Share Tech Mono', monospace; cursor: pointer; font-size: 11px; border-radius: 4px; padding: 7px 14px; letter-spacing: 0.08em; transition: all 0.15s; border: 1px solid; }
  .btn-ghost { background: transparent; border-color: var(--border-bright); color: var(--ink-2); }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-cyan { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan-glow); }

  /* Add task */
  .add-row { display: flex; gap: 6px; margin-top: 6px; }
  .add-row input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-size: 12px; font-family: 'Share Tech Mono', monospace; color: var(--cyan); min-width: 0; }
  .add-row input::placeholder { color: var(--ink-3); }
  .add-row input:focus { outline: none; border-color: var(--cyan); }
  .add-row button { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); padding: 7px 12px; white-space: nowrap; }

  /* Per-person add row */
  .person-add { display: flex; gap: 5px; margin-top: 6px; }
  .person-add input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 11px; font-family: 'Share Tech Mono', monospace; min-width: 0; }
  .person-add input:focus { outline: none; }
  .nora-col .person-add input { color: var(--cyan); }
  .nora-col .person-add input:focus { border-color: var(--cyan); }
  .ludwig-col .person-add input { color: var(--purple); }
  .ludwig-col .person-add input:focus { border-color: var(--purple); }
  .person-add input::placeholder { color: var(--ink-3); }
  .nora-col .person-add button { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); padding: 6px 10px; font-size: 13px; }
  .ludwig-col .person-add button { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); padding: 6px 10px; font-size: 13px; }

  /* Delete task button */
  .task-del { background: none; border: none; color: var(--ink-3); font-size: 13px; cursor: pointer; padding: 0; line-height: 1; font-family: 'Share Tech Mono', monospace; margin-left: auto; }
  .task-del:hover { color: var(--red); }

  footer { margin-top: 32px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="sys">SYS // STAD.EXE v1.0</div>
    <h1>STÄDLISTAN</h1>
    <div class="sub" id="headerSub">NORA & LUDWIG — VECKOROTATION</div>
  </div>

  <div class="week-bar">
    <div class="week-info">
      <div>VECKA <strong id="weekNum">—</strong></div>
      <div class="next-swap" id="nextSwap">Nästa byte: —</div>
    </div>
    <div class="sync-indicator">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">ANSLUTER</span>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-ghost" id="resetBtn">NY VECKA</button>
    <button class="btn-ghost" id="swapBtn">BYTA UPPGIFTER</button>
  </div>

  <div class="divider"></div>

  <div class="columns" id="columns"></div>

  <div class="shared-section">
    <div class="section-label"><span>Gemensamt</span></div>
    <ul class="shared-list" id="sharedList"></ul>
    <div class="add-row">
      <input type="text" id="sharedInput" placeholder="// LÄGG TILL GEMENSAM UPPGIFT">
      <button id="sharedAddBtn">+</button>
    </div>
  </div>

  <footer>// BYTER AUTOMATISKT VARJE MÅNDAG // SYNKAS I REALTID //</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN_Afs3-fXbCURm8VBC8ydUb8_qKEzfb4",
  authDomain: "inkopslista-94013.firebaseapp.com",
  databaseURL: "https://inkopslista-94013-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "inkopslista-94013",
  storageBucket: "inkopslista-94013.firebasestorage.app",
  messagingSenderId: "895498723280",
  appId: "1:895498723280:web:40b840374dd07fb17d63d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const stadRef = ref(db, 'stad');

const PERSONS = ['nora', 'ludwig'];
const PERSON_NAMES = { nora: 'NORA', ludwig: 'LUDWIG' };

const DEFAULT_TASKS = {
  nora: ['Dammsuga vardagsrum','Dammsuga sovrum','Torka golv kök','Städa badrum','Torka ytor i kök'],
  ludwig: ['Dammsuga hall','Tvätta toalett','Byta sängkläder','Torka damm','Ta ut sopor']
};

const DEFAULT_SHARED = ['Handla förbrukningsvaror','Vattna blommor','Rensa kylskåp'];

function getWeekNumber(d){
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getNextMonday(){
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? 1 : 8 - day;
  const next = new Date(d);
  next.setDate(d.getDate() + diff);
  return next.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
}

function buildDefaults(){
  const tasks = {};
  PERSONS.forEach(p => {
    DEFAULT_TASKS[p].forEach((name, i) => {
      const id = p + '__task' + i;
      tasks[id] = { id, person: p, name, done: false, custom: false };
    });
  });
  const shared = {};
  DEFAULT_SHARED.forEach((name, i) => {
    shared['shared__' + i] = { id: 'shared__' + i, name, done: false, doneBy: null };
  });
  return { tasks, shared, swapped: false, week: getWeekNumber(new Date()) };
}

let state = { tasks: {}, shared: {}, swapped: false, week: 0 };

function setSyncStatus(s){
  document.getElementById('syncDot').className = 'sync-dot ' + (s === 'ok' ? 'ok' : s === 'err' ? 'err' : '');
  document.getElementById('syncLabel').textContent = s === 'ok' ? 'ONLINE' : s === 'err' ? 'FEL' : 'ANSLUTER';
}

function checkWeekRotation(data){
  const currentWeek = getWeekNumber(new Date());
  if(data.week && data.week !== currentWeek){
    const newTasks = {};
    Object.values(data.tasks || {}).forEach(t => {
      const newPerson = t.person === 'nora' ? 'ludwig' : 'nora';
      newTasks[t.id] = { ...t, person: newPerson, done: false };
    });
    data.tasks = newTasks;
    data.week = currentWeek;
    data.swapped = false;
    Object.keys(data.shared || {}).forEach(k => { data.shared[k].done = false; data.shared[k].doneBy = null; });
    set(stadRef, data);
  }
  return data;
}

// Listen to Firebase — always update state from server
onValue(stadRef, (snapshot) => {
  let data = snapshot.val();
  if(!data){
    data = buildDefaults();
    set(stadRef, data);
  } else {
    data = checkWeekRotation(data);
  }
  state = data;
  setSyncStatus('ok');
  render();
}, () => setSyncStatus('err'));

// Save a single field directly to Firebase
function saveField(path, val){
  set(ref(db, 'stad/' + path), val)
    .then(() => setSyncStatus('ok'))
    .catch(() => setSyncStatus('err'));
}

function saveAll(){
  set(stadRef, state)
    .then(() => setSyncStatus('ok'))
    .catch(() => setSyncStatus('err'));
}

function toggleTask(id){
  const t = state.tasks[id]; if(!t) return;
  const newDone = !t.done;
  saveField('tasks/' + id + '/done', newDone);
}

function toggleShared(id){
  const t = state.shared[id]; if(!t) return;
  const newDone = !t.done;
  saveField('shared/' + id + '/done', newDone);
}

function addPersonTask(person, name){
  name = name.trim(); if(!name) return;
  const id = person + '__custom-' + Date.now();
  const item = { id, person, name, done: false, custom: true };
  saveField('tasks/' + id, item);
}

function addShared(name){
  name = name.trim(); if(!name) return;
  const id = 'shared__custom-' + Date.now();
  saveField('shared/' + id, { id, name, done: false, doneBy: null });
}

function deleteTask(id){
  saveField('tasks/' + id, null);
}

function deleteShared(id){
  saveField('shared/' + id, null);
}

function renameTask(id, newName){
  saveField('tasks/' + id + '/name', newName);
}

function renameShared(id, newName){
  saveField('shared/' + id + '/name', newName);
}

function swapTasks(){
  const newTasks = {};
  Object.values(state.tasks).forEach(t => {
    const newPerson = t.person === 'nora' ? 'ludwig' : 'nora';
    newTasks[t.id] = { ...t, person: newPerson, done: false };
  });
  state.tasks = newTasks;
  state.swapped = !state.swapped;
  saveAll();
}

function resetWeek(){
  Object.keys(state.tasks).forEach(id => { state.tasks[id].done = false; });
  Object.keys(state.shared || {}).forEach(id => { state.shared[id].done = false; state.shared[id].doneBy = null; });
  state.week = getWeekNumber(new Date());
  saveAll();
}

function render(){
  const weekNum = getWeekNumber(new Date());
  document.getElementById('weekNum').textContent = weekNum;
  document.getElementById('nextSwap').textContent = 'Nästa byte: ' + getNextMonday();

  const colsEl = document.getElementById('columns');
  colsEl.innerHTML = '';

  PERSONS.forEach(person => {
    const myTasks = Object.values(state.tasks).filter(t => t.person === person);
    const doneTasks = myTasks.filter(t => t.done).length;
    const allDone = myTasks.length > 0 && doneTasks === myTasks.length;

    const col = document.createElement('div');
    col.className = 'person-col ' + person + '-col';

    const header = document.createElement('div');
    header.className = 'person-header';

    const nameEl = document.createElement('div');
    nameEl.className = 'person-name ' + person;
    nameEl.textContent = PERSON_NAMES[person];

    const prog = document.createElement('div');
    prog.className = 'person-progress' + (allDone ? ' done' : '');
    prog.textContent = doneTasks + '/' + myTasks.length;

    header.appendChild(nameEl);
    header.appendChild(prog);
    col.appendChild(header);

    const ul = document.createElement('ul');
    ul.className = 'task-list';

    myTasks.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task-item' + (t.done ? ' done' : '');
      li.addEventListener('click', (e) => {
        if(!e.target.classList.contains('task-del')) toggleTask(t.id);
      });

      const check = document.createElement('div');
      check.className = 'task-check';
      check.textContent = t.done ? '✓' : '';

      const name = document.createElement('span');
      name.className = 'task-name';
      name.textContent = t.name;

      const editBtn = document.createElement('button');
      editBtn.className = 'task-del';
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const newName = prompt('Ändra uppgift:', t.name);
        if(newName && newName.trim()) renameTask(t.id, newName.trim());
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'task-del';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(confirm('Ta bort "' + t.name + '"?')) deleteTask(t.id);
      });

      li.appendChild(check);
      li.appendChild(name);
      li.appendChild(editBtn);
      li.appendChild(delBtn);
      ul.appendChild(li);
    });

    col.appendChild(ul);

    // Per-person add row
    const addRow = document.createElement('div');
    addRow.className = 'person-add';
    const addInp = document.createElement('input');
    addInp.placeholder = '// LÄGG TILL';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    const doAdd = () => { addPersonTask(person, addInp.value); addInp.value = ''; };
    addBtn.addEventListener('click', doAdd);
    addInp.addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });
    addRow.appendChild(addInp);
    addRow.appendChild(addBtn);
    col.appendChild(addRow);

    colsEl.appendChild(col);
  });

  // Shared
  const sharedEl = document.getElementById('sharedList');
  sharedEl.innerHTML = '';
  Object.values(state.shared || {}).forEach(t => {
    const li = document.createElement('li');
    li.className = 'shared-item' + (t.done ? ' done' : '');
    li.addEventListener('click', (e) => {
      if(!e.target.classList.contains('task-del')) toggleShared(t.id);
    });

    const check = document.createElement('div');
    check.className = 'shared-check';
    check.textContent = t.done ? '✓' : '';

    const name = document.createElement('span');
    name.className = 'shared-name';
    name.textContent = t.name;

    const sEdit = document.createElement('button');
    sEdit.className = 'task-del';
    sEdit.textContent = '✎';
    sEdit.addEventListener('click', (e) => {
      e.stopPropagation();
      const newName = prompt('Ändra uppgift:', t.name);
      if(newName && newName.trim()) renameShared(t.id, newName.trim());
    });

    const sDel = document.createElement('button');
    sDel.className = 'task-del';
    sDel.textContent = '×';
    sDel.addEventListener('click', (e) => {
      e.stopPropagation();
      if(confirm('Ta bort "' + t.name + '"?')) deleteShared(t.id);
    });

    li.appendChild(check);
    li.appendChild(name);
    li.appendChild(sEdit);
    li.appendChild(sDel);
    sharedEl.appendChild(li);
  });
}

document.getElementById('resetBtn').addEventListener('click', resetWeek);
document.getElementById('swapBtn').addEventListener('click', swapTasks);

const sharedInput = document.getElementById('sharedInput');
document.getElementById('sharedAddBtn').addEventListener('click', () => {
  addShared(sharedInput.value); sharedInput.value = '';
});
sharedInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ addShared(sharedInput.value); sharedInput.value = ''; }
});
</script>
